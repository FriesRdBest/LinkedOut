    relevant_roles:
      - Support Operations Engineer
      - Automation Analyst
      - Customer Solutions Engineer
  - title: Pattern Library
    repository: https://github.com/FriesRdBest/pattern-library
    status: Supporting
    problem: Product and customer insights often recur but are not captured in a reusable, evidence led structure.
    user_decision: Identify recurring product and customer patterns and connect them to evidence.
    solution: An evidence led pattern library for recurring product and customer insights.
    stack:
      - Python
      - Insight synthesis
      - Product research
      - Knowledge management
    ai_contribution: Accelerated pattern structure, documentation, and knowledge organization.
    human_contribution: Defined the evidence standard, pattern model, and insight classification approach.
    limitations: The library depends on consistently captured evidence to remain useful over time.
    business_value: Turns scattered observations into reusable product and customer knowledge.
    relevant_roles:
      - Product Analyst
      - Research Operations Specialist
      - Product Operations Manager
